<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F8FB" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="ClearWrite mobile learning workspace" />
    <title>ClearWrite · Mobile</title>
    <script>
      try {
        var saved = localStorage.getItem('igt.mobile.theme');
        if (saved && saved !== 'system') document.documentElement.setAttribute('data-theme', JSON.parse(saved));
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; padding: 0; background: #F6F8FB; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #0F1626; }
      }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0F1626; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
